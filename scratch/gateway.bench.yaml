server:
  addr: ":8080"
  metrics_addr: ":9090"
  read_timeout: 5s
  shutdown_grace: 5s

redis:
  addrs: ["localhost:6379"]
  pool_size: 100
  dial_timeout: 50ms
  command_timeout: 50ms

breaker:
  error_ratio: 0.5
  min_requests: 10
  open_duration: 10s
  half_open_successes: 3

identity:
  order: ["api_key"]
  api_key_header: "X-API-Key"
  default_tier: "free"

api_keys:
  "alice-key": "pro"

tiers:
  pro:
    limit: 100
    window: 10s

routes:
  - pattern: "/api/v1/orders"
    algorithm: "sliding_window_counter"
    store: "redis"
    cost: 1
    fallback: "closed"
    upstream: "http://localhost:9000"
    l1_cache:
      enabled: true
      ttl: 5ms
      remaining_threshold: 0.1
