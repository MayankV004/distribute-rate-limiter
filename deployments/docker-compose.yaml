# docker-compose stack: nginx LB → 3 gateway replicas → redis + backend + prometheus + grafana
# TODO (Phase 8): activate once all services build successfully.
# Phase 0–7: use the single-node dev setup with `go run ./cmd/gateway -config configs/gateway.dev.yaml`

services:
  nginx:
    image: nginx:alpine
    ports: ["80:80"]
    volumes: ["./nginx.conf:/etc/nginx/nginx.conf:ro"]
    depends_on: [gateway1, gateway2, gateway3]

  gateway1:
    build: { context: .., dockerfile: deployments/Dockerfile }
    entrypoint: ["/gateway", "/configs/gateway.yaml"]
    environment: [GATEWAY_REDIS_ADDRS=redis:6379]
    volumes:
      - "../configs/gateway.yaml:/configs/gateway.yaml:ro"
    ports: ["8080:8080"]   # proxy port published externally
    expose: ["9090"]       # G8: metrics port internal only; Prometheus scrapes it on the docker network
    depends_on: [redis]

  gateway2:
    build: { context: .., dockerfile: deployments/Dockerfile }
    entrypoint: ["/gateway", "/configs/gateway.yaml"]
    environment: [GATEWAY_REDIS_ADDRS=redis:6379]
    volumes:
      - "../configs/gateway.yaml:/configs/gateway.yaml:ro"
    ports: ["8081:8080"]
    expose: ["9090"]       # G8: not published
    depends_on: [redis]

  gateway3:
    build: { context: .., dockerfile: deployments/Dockerfile }
    entrypoint: ["/gateway", "/configs/gateway.yaml"]
    environment: [GATEWAY_REDIS_ADDRS=redis:6379]
    volumes:
      - "../configs/gateway.yaml:/configs/gateway.yaml:ro"
    ports: ["8082:8080"]
    expose: ["9090"]       # G8: not published
    depends_on: [redis]

  redis:
    image: redis:7-alpine
    command: redis-server --save ""  # disable persistence, counters are ephemeral

  # G7: toxiproxy adds controlled latency/jitter to Redis for breaker calibration.
  # Usage: toxiproxy-cli toxic add redis_upstream -t latency -a latency=50 -a jitter=20
  # Gateway points to toxiproxy:26379 (proxies to redis:6379) during Phase 5 experiment.
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.7.0
    ports: ["8474:8474", "26379:26379"]   # 8474=API, 26379=Redis proxy port
    depends_on: [redis]

  dummy-backend:
    build: { context: .., dockerfile: deployments/Dockerfile }
    entrypoint: ["/backend"]
    command: ["-addr", ":9000"]
    ports: ["9000:9000"]

  prometheus:
    image: prom/prometheus:latest
    volumes: ["./prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:latest
    volumes: 
      - "./grafana:/etc/grafana/provisioning/dashboards"
      - "./grafana/datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml"
    ports: ["3000:3000"]
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
